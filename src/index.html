<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Splitter</title>
  <style>
    /* ── Reset ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    /* ── Theme variables ──────────────────────────────────── */
    :root {
      --bg:       var(--hub-bg,           #f9fafb);
      --card:     var(--hub-surface,      #ffffff);
      --border:   var(--hub-border,       #e5e7eb);
      --text:     var(--hub-text,         #111827);
      --muted:    var(--hub-text-muted,   #6b7280);
      --accent:   var(--hub-primary,      #0891b2);
      --accent-h: var(--hub-primary-hover,#0e7490);
      --accent-fg:var(--hub-primary-fg,   #ffffff);
      --radius:   var(--hub-radius,       0.5rem);
      --shadow:   0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --green:    #16a34a; --green-ink: var(--hub-tint-success-fg, #16a34a); --green-lt: var(--hub-tint-success, #dcfce7);
      --red:      #dc2626; --red-ink: var(--hub-tint-danger-fg, #dc2626); --red-lt:   var(--hub-tint-danger, #fee2e2);
      --amber:    #d97706; --amber-lt: #fef3c7;
    }

    /* ── Base ────────────────────────────────────────────── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }
    .app-container { max-width: 600px; margin: 0 auto; padding: 14px 14px 80px; }

    /* ── Header ──────────────────────────────────────────── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--accent); color: var(--accent-fg);
      border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
    }
    .header-title { font-size: 1.15rem; font-weight: 700; }
    .header-sub   { font-size: 0.78rem; opacity: .75; margin-top: 1px; }

    /* ── Balance banner ──────────────────────────────────── */
    .balance-banner {
      border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
      border: 1.5px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow);
      animation: fadeIn .2s ease;
    }
    .balance-banner.positive { border-color: var(--green); background: var(--green-lt); }
    .balance-banner.negative { border-color: var(--red);   background: var(--red-lt);   }
    .balance-banner.settled  { border-color: var(--border); }
    .balance-label  { font-size: .85rem; color: var(--muted); font-weight: 500; }
    .balance-amount { font-size: 1.6rem; font-weight: 800; letter-spacing: -.5px; }
    .balance-banner.positive .balance-label  { color: var(--green-ink); }
    .balance-banner.negative .balance-label  { color: var(--red-ink); }
    .balance-banner.positive .balance-amount { color: var(--green-ink); }
    .balance-banner.negative .balance-amount { color: var(--red-ink); }
    .balance-settled-msg { font-size: 1rem; font-weight: 600; color: var(--muted); }

    /* ── Tabs ────────────────────────────────────────────── */
    .tabs {
      display: flex; gap: 4px;
      background: var(--border); border-radius: 10px; padding: 3px;
      margin-bottom: 14px;
    }
    .tab {
      flex: 1; padding: 7px; border: none; cursor: pointer;
      border-radius: 8px; font-size: .85rem; font-weight: 600;
      color: var(--muted); background: transparent;
      transition: all .15s;
    }
    .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

    /* ── Section label ───────────────────────────────────── */
    .section-label {
      font-size: .75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted); margin: 14px 0 8px;
    }

    /* ── Debt cards (Balances view) ──────────────────────── */
    .debt-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; box-shadow: var(--shadow); animation: slideIn .18s ease both;
    }
    .debt-card.i-owe   { border-color: var(--red);   background: var(--red-lt); }
    .debt-card.they-owe{ border-color: var(--green); background: var(--green-lt); }
    .debt-members { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .debt-arrow   { font-size: 1rem; color: var(--muted); flex-shrink: 0; }
    .debt-names   { display: flex; flex-direction: column; min-width: 0; }
    .debt-from, .debt-to { font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .debt-from    { font-weight: 700; }
    .debt-verb    { font-size: .72rem; color: var(--muted); }
    .debt-to      { font-weight: 600; color: var(--muted); }
    .debt-right   { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .debt-amount  { font-size: 1.05rem; font-weight: 800; }

    /* ── Expense cards ───────────────────────────────────── */
    .expense-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: var(--shadow); cursor: pointer;
      transition: border-color .13s, box-shadow .13s;
      animation: slideIn .18s ease both;
      content-visibility: auto; contain-intrinsic-size: 0 72px;
    }
    .expense-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(8,145,178,.12); }
    .expense-icon  { font-size: 1.5rem; flex-shrink: 0; width: 36px; text-align: center; }
    .expense-main  { flex: 1; min-width: 0; }
    .expense-desc  { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .expense-meta  { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .expense-right { text-align: right; flex-shrink: 0; }
    .expense-amount     { font-weight: 800; font-size: 1rem; }
    .expense-cat-label  { font-size: .72rem; color: var(--muted); margin-top: 2px; }

    /* ── Avatars ──────────────────────────────────────────── */
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: .85rem; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .avatar-sm { width: 20px; height: 20px; font-size: .65rem; }

    /* ── Buttons ──────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 8px 16px; border-radius: 8px; font-size: .875rem;
      font-weight: 600; cursor: pointer; border: none; transition: opacity .15s;
    }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-h); }
    .btn-ghost   { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--text); color: var(--text); }
    .btn-danger  { background: var(--red); color: #fff; }
    .btn-danger:hover:not(:disabled) { opacity: .88; }
    .btn-sm      { padding: 5px 11px; font-size: .8rem; }
    .btn-add {
      background: rgba(255,255,255,.22); color: #fff; border: 1.5px solid rgba(255,255,255,.4);
      padding: 7px 14px; border-radius: 8px; font-size: .85rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .btn-add:hover { background: rgba(255,255,255,.35); }
    .btn-settle { background: var(--card); color: var(--accent); border: 1.5px solid var(--accent); }
    .btn-settle:hover { background: var(--accent); color: var(--accent-fg); }

    /* ── Search & category filter ────────────────────────── */
    .search-row { margin-bottom: 10px; }
    .search-input {
      width: 100%; padding: 9px 14px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: .9rem; background: var(--card);
      color: var(--text); outline: none; transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .cat-filter {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px;
      margin-bottom: 10px; scrollbar-width: none;
    }
    .cat-filter::-webkit-scrollbar { display: none; }
    .cat-pill {
      flex-shrink: 0; padding: 5px 12px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--card);
      font-size: .8rem; font-weight: 600; cursor: pointer; color: var(--muted);
      transition: all .13s; white-space: nowrap;
    }
    .cat-pill.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .cat-pill:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

    /* ── Reimbursement requests ──────────────────────────── */
    .request-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
    }
    .request-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .request-title  { font-weight: 600; font-size: .92rem; }
    .request-sub    { font-size: .8rem; color: var(--muted); margin-top: 2px; }
    .request-amount { font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
    .request-foot {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px;
    }
    .request-hint    { font-size: .78rem; color: var(--muted); }
    .request-actions { margin-left: auto; display: flex; gap: 6px; }
    .badge {
      font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: .02em;
    }
    .badge-pending   { background: var(--hub-tint-warning, #fef3c7); color: var(--hub-tint-warning-fg, #92400e); }
    .badge-locked    { background: var(--hub-tint-success, #dcfce7); color: var(--hub-tint-success-fg, #166534); }
    .badge-settled   { background: var(--hub-tint-info, #dbeafe); color: var(--hub-tint-info-fg, #1e40af); }
    .badge-cancelled { background: var(--border); color: var(--muted); }

    /* ── Form fields (shared by the request + receipt UI) ── */
    label.field { display: block; margin-bottom: 12px; font-size: .85rem; }
    label.field > span { display: block; margin-bottom: 4px; color: var(--muted); font-weight: 600; }
    label.field input, label.field select {
      width: 100%; padding: 9px 12px; border: 1.5px solid var(--border);
      border-radius: 8px; font: inherit; background: var(--card); color: var(--text);
    }
    .hint { font-size: .78rem; color: var(--muted); margin: 0; line-height: 1.4; }
    .receipt-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .receipt-thumb {
      max-width: 100%; max-height: 220px; border-radius: 8px;
      border: 1.5px solid var(--border); display: block; margin-top: 8px;
    }

    /* ── Summary ─────────────────────────────────────────── */
    .sum-total {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 16px; text-align: center; margin-bottom: 14px;
    }
    .sum-total-amount { font-size: 1.8rem; font-weight: 700; letter-spacing: -.02em; }
    .sum-total-sub    { font-size: .8rem; color: var(--muted); margin-top: 2px; }
    .sum-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 0; border-bottom: 1px solid var(--border);
    }
    .sum-row:last-child { border-bottom: none; }
    .sum-row-main  { flex: 1; min-width: 0; }
    .sum-row-name  { font-size: .88rem; font-weight: 600; display: flex; align-items: center; gap: 7px; }
    .sum-row-sub   { font-size: .75rem; color: var(--muted); margin-top: 2px; }
    .sum-row-value { font-weight: 700; font-size: .95rem; white-space: nowrap; }
    .sum-bar {
      height: 4px; border-radius: 3px; background: var(--border);
      margin-top: 5px; overflow: hidden;
    }
    .sum-bar > i { display: block; height: 100%; background: var(--accent); }
    .sum-net-pos { color: var(--green-ink); }
    .sum-net-neg { color: var(--red-ink); }

    /* ── Export ──────────────────────────────────────────── */
    .export-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; margin-top: 16px;
    }
    .export-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .export-row:last-of-type { border-bottom: none; }
    .export-row-main { flex: 1; min-width: 150px; }
    .export-row-title { font-size: .87rem; font-weight: 600; }
    .export-row-sub   { font-size: .75rem; color: var(--muted); margin-top: 2px; line-height: 1.35; }
    .export-actions   { display: flex; gap: 6px; }

    /* ── Pay-via link ────────────────────────────────────── */
    .pay-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 8px; text-decoration: none;
      background: var(--accent); color: var(--accent-fg);
      font-size: .85rem; font-weight: 600;
    }
    .pay-note { font-size: .8rem; color: var(--muted); margin-top: 10px; }

    /* ── Empty states ────────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 48px 20px; color: var(--muted);
      animation: fadeIn .25s ease;
    }
    .empty-icon  { font-size: 2.5rem; margin-bottom: 10px; }
    .empty-title { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .empty-sub   { font-size: .85rem; }

    /* ── Skeleton loaders ────────────────────────────────── */
    @keyframes shimmer {
      from { background-position: -200% center; }
      to   { background-position:  200% center; }
    }
    .sk {
      background: linear-gradient(90deg, var(--border) 25%, var(--card) 50%, var(--border) 75%);
      background-size: 200% auto;
      animation: shimmer 1.3s linear infinite;
      border-radius: var(--radius);
      margin-bottom: 10px;
    }
    .sk-header  { height: 56px; }
    .sk-banner  { height: 68px; }
    .sk-tabs    { height: 42px; }
    .sk-card    { height: 72px; }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end;
      z-index: 200;
      animation: fadeIn .15s ease;
    }
    .modal-sheet {
      background: var(--card);
      border-radius: calc(var(--radius) * 2) calc(var(--radius) * 2) 0 0;
      width: 100%; max-height: 92dvh; overflow-y: auto;
      animation: slideUp .22s cubic-bezier(.32,1,.23,1);
      will-change: transform;
      display: flex; flex-direction: column;
    }
    .modal-backdrop.closing .modal-sheet {
      animation: slideDown .18s ease forwards;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px 10px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--card); z-index: 1;
      flex-shrink: 0;
    }
    .modal-title  { font-size: 1rem; font-weight: 700; }
    .modal-close  {
      background: none; border: none; font-size: 1.4rem; cursor: pointer;
      color: var(--muted); line-height: 1; padding: 2px 6px; border-radius: 4px;
    }
    .modal-close:hover { color: var(--text); background: var(--border); }
    .modal-body   { padding: 16px 18px; flex: 1; overflow-y: auto; }
    .modal-footer {
      padding: 12px 18px; border-top: 1px solid var(--border);
      display: flex; gap: 8px; justify-content: flex-end;
      position: sticky; bottom: 0; background: var(--card); flex-shrink: 0;
    }

    /* ── Form elements ───────────────────────────────────── */
    .form-group  { margin-bottom: 16px; }
    .form-label  { font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: .04em; }
    .text-input  {
      width: 100%; padding: 9px 12px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: .9rem; background: var(--card);
      color: var(--text); outline: none; transition: border-color .15s;
    }
    .text-input:focus { border-color: var(--accent); }

    /* Large amount input */
    .amount-wrap {
      display: flex; align-items: center; justify-content: center;
      gap: 4px; margin-bottom: 18px; padding: 16px;
      background: var(--bg); border-radius: var(--radius); border: 1.5px solid var(--border);
    }
    .amount-symbol { font-size: 2rem; font-weight: 700; color: var(--muted); line-height: 1; }
    .amount-input  {
      border: none; outline: none; background: transparent;
      font-size: 2.4rem; font-weight: 800; color: var(--text);
      width: 180px; text-align: center; font-family: inherit;
    }
    .amount-input::placeholder { color: var(--border); }
    /* Hide number spinners */
    .amount-input::-webkit-outer-spin-button,
    .amount-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .amount-input[type=number] { -moz-appearance: textfield; }

    /* Category pills in form */
    .form-cat-pills {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .form-cat-pill {
      padding: 5px 10px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--card);
      font-size: .8rem; font-weight: 600; cursor: pointer; color: var(--muted);
      transition: all .13s;
    }
    .form-cat-pill.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

    /* Member pill selector (paid-by: single select) */
    .member-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .member-pill  {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--card);
      font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--muted);
      transition: all .13s;
    }
    .member-pill.active  { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
    .member-pill:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

    /* Member checkbox grid (split-among: multi select) */
    .member-checks { display: flex; flex-wrap: wrap; gap: 6px; }
    .member-check-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--card);
      font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--muted);
      transition: all .13s; user-select: none;
    }
    .member-check-pill.checked { border-color: var(--accent); background: var(--hub-tint-info, #ecfeff); color: var(--accent); }
    .member-check-pill input[type=checkbox] { display: none; }

    /* Split method toggle */
    .split-toggle { display: flex; gap: 4px; background: var(--border); border-radius: 8px; padding: 3px; }
    .split-toggle-btn {
      flex: 1; padding: 6px; border-radius: 6px; border: none; cursor: pointer;
      font-size: .82rem; font-weight: 600; color: var(--muted); background: transparent;
      transition: all .13s;
    }
    .split-toggle-btn.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

    /* Split preview */
    .split-preview {
      background: var(--bg); border-radius: var(--radius); padding: 12px 14px;
      margin-top: 10px; border: 1px solid var(--border);
    }
    .split-preview-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 0; border-bottom: 1px solid var(--border);
    }
    .split-preview-row:last-child { border-bottom: none; }
    .split-preview-member { display: flex; align-items: center; gap: 7px; font-size: .85rem; font-weight: 600; }
    .split-preview-amount { font-size: .85rem; font-weight: 700; color: var(--accent); }
    .split-remaining { font-size: .8rem; font-weight: 600; margin-top: 8px; text-align: right; }
    .split-remaining.ok  { color: var(--green-ink); }
    .split-remaining.bad { color: var(--red-ink); }

    .custom-amounts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .custom-row { display: flex; align-items: center; gap: 10px; }
    .custom-row-label { display: flex; align-items: center; gap: 6px; flex: 1; font-size: .85rem; font-weight: 600; }
    .custom-input {
      width: 90px; padding: 7px 10px; border: 1.5px solid var(--border);
      border-radius: 6px; font-size: .9rem; background: var(--card);
      color: var(--text); outline: none; text-align: right;
      transition: border-color .15s;
    }
    .custom-input:focus { border-color: var(--accent); }

    /* Expense detail card */
    .detail-amount { font-size: 2rem; font-weight: 800; margin-bottom: 2px; }
    .detail-desc   { font-size: 1rem; font-weight: 600; color: var(--muted); margin-bottom: 16px; }
    .detail-row    {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border); font-size: .88rem;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-key    { color: var(--muted); font-weight: 600; }
    .detail-val    { font-weight: 700; display: flex; align-items: center; gap: 6px; }

    /* Toast notifications */
    #toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast {
      padding: 10px 18px; border-radius: 8px; font-size: .88rem; font-weight: 600;
      color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.2);
      opacity: 0; transform: translateY(6px);
      transition: opacity .22s ease, transform .22s ease;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.info    { background: var(--text); }
    .toast.success { background: var(--green); }
    .toast.error   { background: var(--red); }

    /* Widget mode */

    .widget-balance { font-size: 1.4rem; font-weight: 800; }
    .widget-label   { font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
    .widget-sub     { font-size: .78rem; color: var(--muted); margin-top: 4px; }
    .widget-settled { font-size: .95rem; font-weight: 600; color: var(--muted); }

    /* Animations */
    @keyframes fadeIn  { from { opacity: 0 }                              to { opacity: 1 } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes slideUp { from { transform: translateY(100%) }             to { transform: translateY(0) } }
    @keyframes slideDown{ from { transform: translateY(0) }               to { transform: translateY(100%) } }
  </style>
</head>
<body>
<div id="app">

                  aria-label="Summary period"></select>

          <button class="btn-add" id="rules-btn" data-action="openSplitRules">Split rules</button>
          <button class="btn-add" id="pay-btn" data-action="openPayHandle">How to pay me</button>
        </div>

  <div id="toasts" aria-live="polite"></div>

<script type="module">
import { esc, memberColor, initial, fmtMoney, createFilesHelper, searchMatch, hubToday } from '/hub-sdk.js';
import {
  CATEGORIES, categoryFor,
  computeBalances, simplifyDebts, computeSplits, validateCustomSplits,
  fmtSplit, fmtDate,
  computeSplitsWithCategory, reimbursementStatus, validateReimbursement,
  validateCategoryPercents, TOTAL_BP, searchableFields,
  SPLIT_METHODS, splitTypeLabel, validateShares, sharesError, MAX_SHARES,
  CATEGORY_RULE_SPLIT, apportionByShares, apportionByPercent,
  summarize, expenseMonths, monthLabel, rangeForPeriod, monthKey,
  PAYMENT_SERVICES, paymentServiceFor, validateHandle, displayHandle, payLink, handleMap,
} from './logic.js';

/* ── Runtime globals ─────────────────────────────────── */
const CONTEXT    = window.__CONTEXT_URL ?? '';
const DB         = window.__DB_URL      ?? '';
const ME         = window.__CURRENT_MEMBER ?? { id: 'demo-me', name: 'You', role: 'adult' };
const APP_ID     = window.__APP_ID ?? 'expense-splitter';
const EVENTS_URL = window.__EVENTS_URL ?? '/api/events';
// Money management mirrors the adult_writable policy on all three tables:
// only adults may add or delete expenses and record settlements. Non-adults
// still read everything (balances stay accurate for every viewer).
const IS_ADULT   = ME.role === 'adult';
const FILES      = createFilesHelper(window.__FILES_URL ?? '');
const CAN_UPLOAD = !!window.__FILES_URL;

/* ── Event delegation ────────────────────────────────── */
// Handlers are wired with `data-action` + `data-*` arguments and dispatched
// here, never with inline `onclick="fn('${value}')"`.
//
// Why: esc() escapes ' to &#39;, and the HTML parser decodes that back to a
// real quote BEFORE the attribute is parsed as JavaScript — so an inline
// handler carrying a DB value is injectable even though it looks escaped. Any
// member can choose those values by POSTing raw SQL to /api/db (row ids,
// member ids, and — since SQLite affinity is not type enforcement — even
// INTEGER columns like amount_cents). Values read back through `dataset` are
// never parsed as JavaScript, which closes the whole class.
//
// Delegation also means markup re-rendered via innerHTML needs no re-wiring.
const CLICK_ACTIONS = {
  openAdd:          () => window._openAdd(),
  openRequest:      () => window._openRequest(),
  openSplitRules:   () => window._openSplitRules(),
  openPayHandle:    () => window._openPayHandle(),
  savePayHandle:    () => window._savePayHandle(),
  clearPayHandle:   () => window._clearPayHandle(),
  runReport:        el => window._runReport(el.dataset.view, el.dataset.format),
  closeModal:       () => window._closeModal(),
  submitExpense:    () => window._submitExpense(),
  submitRequest:    () => window._submitRequest(),
  saveSplitRule:    () => window._saveSplitRule(),
  switchTab:        el => window._switchTab(el.dataset.tab),
  filterCat:        el => window._filterCat(el.dataset.cat),
  setCategory:      el => window._setCategory(el.dataset.cat),
  setPaidBy:        el => window._setPaidBy(el.dataset.member),
  setSplitMethod:   el => window._setSplitMethod(el.dataset.method),
  openDetail:       el => window._openDetail(el.dataset.expense),
  deleteExpense:    el => window._deleteExpense(el.dataset.expense),
  agreeRequest:     el => window._agreeRequest(el.dataset.request),
  cancelRequest:    el => window._cancelRequest(el.dataset.request),
  settleRequest:    el => window._settleRequest(el.dataset.request),
  openSettle:       el => window._openSettle(
                            el.dataset.from, el.dataset.to, Number(el.dataset.amount) || 0),
  submitSettlement: el => window._submitSettlement(el.dataset.from, el.dataset.to),
};
const INPUT_ACTIONS = {
  search:         el => window._onSearch(el.value),
  weightInput:    el => window._setWeight(el.dataset.member, el.value),
  settleAmount:   () => window._onSettleAmount(
                          document.querySelector('[data-action="submitSettlement"]')?.dataset.to),
  formChange:     () => window._formChange(),
  splitRuleTotal: () => window._splitRuleTotal(),
  customInput:    el => window._onCustomInput(el.dataset.member, el.value),
};
const CHANGE_ACTIONS = {
  summaryPeriod:   el => window._setSummaryPeriod(el.value),
  handleService:   () => window._onHandleService(),
  receiptPicked:   () => window._onReceiptPicked(),
  renderSplitRule: () => window._renderSplitRule(),
  toggleSplit:     el => window._toggleSplit(el.dataset.member, el.checked),
};

function delegate(eventName, table, attr) {
  document.addEventListener(eventName, e => {
    const el = e.target.closest(`[${attr}]`);
    if (!el) return;
    table[el.getAttribute(attr)]?.(el);
  });
}
delegate('click', CLICK_ACTIONS, 'data-action');
delegate('input', INPUT_ACTIONS, 'data-input');
delegate('change', CHANGE_ACTIONS, 'data-change');

/* ── App state ───────────────────────────────────────── */
let members      = [];
let memberMap    = new Map();
let expenses     = [];
let splits       = [];
let settlements  = [];
let balances     = {};
let transactions = [];
let categorySplits = [];   // saved per-category default percentages
let requests       = [];   // reimbursement requests, merged with their agreements
let paymentHandles = [];   // one row per member: where to send them money
let handles        = new Map();

let activeTab      = 'balances';
let activeCategory = 'all';
let searchQuery    = '';
let searchTimer    = null;
let summaryPeriod  = 'all';
// Populated from api/reports, never hard-coded: the endpoint already decides
// which views this caller may render (it drops the admin-only ones), so a list
// built here would be a second copy of that decision, free to drift from the
// manifest and from the caller's role at the same time.
let reportViews    = [];

/* ── DB helper ───────────────────────────────────────── */
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sql, params }),
  });
  if (!res.ok) throw new Error(`DB error ${res.status}`);
  return res.json();
}

/** Several statements in ONE D1 transaction — api/db takes `{statements:[…]}`
 *  alongside `{sql, params}`, and runs the identical validation and row-policy
 *  rewrite on each. Use it wherever a half-applied pair would be worse than a
 *  failure. */
async function dbBatch(statements) {
  if (!DB) return { results: [] };
  const res = await fetch(DB, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ statements }),
  });
  if (!res.ok) throw new Error(`DB error ${res.status}`);
  return res.json();
}

/* ── Init ────────────────────────────────────────────── */
async function init() {
  const params = new URLSearchParams(window.location.search);

  if (params.get('view') === 'widget') {
    try {
      await Promise.all([loadMembers(), loadData()]);
      recompute();
      renderWidget();
    } catch { renderWidget(); }
    return;
  }

  try {
    // The view list is not needed to render anything above the fold, so a slow
    // or failing reports endpoint must not hold up the app; loadReportViews
    // swallows its own errors and leaves the Export block unrendered.
    await Promise.all([loadMembers(), loadData(), loadReportViews()]);
    recompute();
    showMain();
    renderAll();

    const expenseId = params.get('expenseId');
    if (expenseId) {
      const exp = expenses.find(e => e.id === expenseId);
      if (exp) openDetailModal(exp.id);
    }
  } catch (e) {
    showError(e.message);
  }
}

async function loadMembers() {
  if (!CONTEXT) {
    members = DEMO_MEMBERS;
    memberMap = new Map(members.map(m => [m.id, m]));
    return;
  }
  const res = await fetch(`${CONTEXT}?keys=family.members`);
  const ctx = await res.json();
  members   = ctx['family.members'] ?? [];
  memberMap = new Map(members.map(m => [m.id, m]));
}

async function loadData() {
  if (!DB) {
    expenses    = DEMO_EXPENSES;
    splits      = DEMO_SPLITS;
    settlements = DEMO_SETTLEMENTS;
    return;
  }
  // reimbursements (party_scoped) and reimbursement_agreements (endpoint_only)
  // are both governed, so a JOIN across them is rejected — load both and merge
  // by id, the same shape co-parenting uses for swaps. All six reads are
  // independent, so they go out together rather than in two waves.
  const [eRes, sRes, pRes, cRes, rRes, aRes, hRes] = await Promise.all([
    db('SELECT * FROM app_expense_splitter__expenses    ORDER BY date DESC, created_at DESC'),
    db('SELECT * FROM app_expense_splitter__expense_splits'),
    db('SELECT * FROM app_expense_splitter__settlements ORDER BY settled_at DESC'),
    db('SELECT * FROM app_expense_splitter__category_splits').catch(() => ({ rows: [] })),
    db('SELECT * FROM app_expense_splitter__reimbursements ORDER BY created_at DESC').catch(() => ({ rows: [] })),
    db('SELECT * FROM app_expense_splitter__reimbursement_agreements').catch(() => ({ rows: [] })),
    db('SELECT * FROM app_expense_splitter__payment_handles').catch(() => ({ rows: [] })),
  ]);
  expenses       = eRes.rows;
  splits         = sRes.rows;
  settlements    = pRes.rows;
  categorySplits = cRes.rows;
  paymentHandles = hRes.rows;
  handles        = handleMap(paymentHandles);

  const agrById = new Map(aRes.rows.map(a => [a.id, a]));
  requests = rRes.rows.map(r => {
    const agr = agrById.get(r.id);
    return {
      ...r,
      status: reimbursementStatus(r, agr),
      requester_agreed: agr?.requester_agreed ? 1 : 0,
      payer_agreed:     agr?.payer_agreed ? 1 : 0,
      locked_at:        agr?.locked_at ?? null,
      // Once locked, the snapshot is what both parties actually agreed to.
      amount_cents: agr?.status === 'locked' && agr.amount_cents != null
        ? agr.amount_cents : r.amount_cents,
    };
  });
}

function recompute() {
  balances     = computeBalances(expenses, splits, settlements);
  transactions = simplifyDebts(balances);
}

/* ── UI state helpers ────────────────────────────────── */
function showMain() {
  document.getElementById('skeleton-state').hidden = true;
  document.getElementById('main-content').hidden   = false;
  // Adults-only writes (adult_writable policy) — hide Add for non-adults so the
  // UI matches the backend instead of failing silently after an optimistic add.
  if (!IS_ADULT) document.getElementById('add-btn').hidden = true;
}
function showError(msg) {
  document.getElementById('skeleton-state').hidden = true;
  document.getElementById('error-state').hidden    = false;
  document.getElementById('error-msg').textContent = msg;
}

/* ── Tab switching ───────────────────────────────────── */
window._switchTab = function(tab) {
  activeTab = tab;
  for (const t of ['balances', 'expenses', 'summary', 'requests']) {
    document.getElementById(`view-${t}`).hidden = tab !== t;
    document.getElementById(`tab-${t}`).classList.toggle('active', tab === t);
  }
  if (tab === 'expenses' && !document.getElementById('cat-filter').children.length) {
    renderCatFilter();
  }
  if (tab === 'summary') renderSummary();
  if (tab === 'requests') renderRequests();
};

/* ── Category filter ─────────────────────────────────── */
function renderCatFilter() {
  const counts = {};
  expenses.forEach(e => { counts[e.category] = (counts[e.category] ?? 0) + 1; });
  const used = CATEGORIES.filter(c => counts[c.id]);

  document.getElementById('cat-filter').innerHTML =
    `<button class="cat-pill active" data-action="filterCat" data-cat="all">All</button>` +
    used.map(c =>
      `<button class="cat-pill" data-action="filterCat" data-cat="${esc(c.id)}">${c.icon} ${esc(c.label)}</button>`
    ).join('');
}

window._filterCat = function(cat) {
  activeCategory = cat;
  // Match on the pill's own data-cat rather than sniffing its label text.
  document.querySelectorAll('.cat-pill').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });
  renderExpensesView();
};

/* ── Search ──────────────────────────────────────────── */
window._onSearch = function(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchQuery = val.trim(); renderExpensesView(); }, 150);
};

/* ── Render all ──────────────────────────────────────── */
function renderAll() {
  renderHeaderSub();
  renderBalanceBanner();
  renderBalancesView();
  renderExpensesView();
  renderCatFilter();
  renderSummary();
  renderRequests();
}

/* ── Spending summary ────────────────────────────────── */
// Everything here is computed from rows already in memory. The period selector
// is rebuilt on every render because the month list is derived from the
// expenses themselves — adding the first expense of a new month has to make
// that month selectable without a reload.

function renderPeriodOptions() {
  const sel = document.getElementById('summary-period');
  if (!sel) return;
  const years  = [...new Set(expenseMonths(expenses).map(k => k.slice(0, 4)))];
  const opts   = [{ value: 'all', label: 'All time' }]
    .concat(years.map(y => ({ value: `year:${y}`, label: y })))
    .concat(expenseMonths(expenses).map(k => ({ value: `month:${k}`, label: monthLabel(k) })));
  // A period that no longer has any expenses behind it (the last one was just
  // deleted) would otherwise leave the select showing a value it has no option
  // for, which renders as blank rather than as the all-time view it falls back
  // to internally.
  if (!opts.some(o => o.value === summaryPeriod)) summaryPeriod = 'all';
  sel.innerHTML = opts.map(o =>
    `<option value="${esc(o.value)}"${o.value === summaryPeriod ? ' selected' : ''}>${esc(o.label)}</option>`
  ).join('');
}

window._setSummaryPeriod = function(value) {
  summaryPeriod = value;
  renderSummary();
};

function renderSummary() {
  renderPeriodOptions();
  renderExportBlock();
  const el = document.getElementById('summary-body');
  if (!el) return;

  const sum = summarize(expenses, splits, rangeForPeriod(summaryPeriod));
  if (sum.count === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <div class="empty-title">Nothing spent yet</div>
        <div class="empty-sub">${expenses.length === 0
          ? 'Add an expense and its totals show up here.'
          : 'No expenses in this period.'}</div>
      </div>`;
    return;
  }

  const top = sum.byCategory[0]?.total_cents || 1;
  el.innerHTML = `
    <div class="sum-total" data-testid="summary-total">
      <div class="sum-total-amount">${fmtMoney(sum.total_cents)}</div>
      <div class="sum-total-sub" data-testid="summary-count">${sum.count} expense${sum.count === 1 ? '' : 's'}</div>
    </div>

    <div class="section-label">By category</div>
    <div class="sum-list">
      ${sum.byCategory.map(c => {
        const cat = categoryFor(c.category);
        return `<div class="sum-row" data-testid="summary-category" data-category="${esc(c.category)}">
          <div class="sum-row-main">
            <div class="sum-row-name">${cat.icon} ${esc(cat.label)}</div>
            <div class="sum-bar"><i style="width:${Math.round((c.total_cents / top) * 100)}%"></i></div>
          </div>
          <div class="sum-row-value">${fmtSplit(c.total_cents)}</div>
        </div>`;
      }).join('')}
    </div>

    <div class="section-label">By person</div>
    <div class="sum-list">
      ${sum.byMember.map(r => {
        const m = memberMap.get(r.member_id) ?? { id: r.member_id, name: r.member_id, role: 'adult' };
        // Paid and owed are both true and neither is the whole story, so the
        // row prints both and names the difference rather than picking one.
        const net = r.net_cents;
        const netText = net === 0 ? 'even'
          : net > 0 ? `${fmtSplit(net)} ahead` : `${fmtSplit(-net)} behind`;
        return `<div class="sum-row">
          <div class="sum-row-main">
            <div class="sum-row-name">${avatar(m, 'sm')} ${esc(m.name)}</div>
            <div class="sum-row-sub">
              paid ${fmtSplit(r.paid_cents)} · owed ${fmtSplit(r.share_cents)} ·
              <span class="${net > 0 ? 'sum-net-pos' : net < 0 ? 'sum-net-neg' : ''}">${netText}</span>
            </div>
          </div>
          <div class="sum-row-value">${fmtSplit(r.paid_cents)}</div>
        </div>`;
      }).join('')}
    </div>`;
}

/* ── Export (manifest `reports`) ─────────────────────── */
// The hub renders the document; the app only says which view and what range.
// The list comes from api/reports rather than from a copy here, so a view added
// to the manifest appears with no change to this file.
//
// But that endpoint only drops the ADMIN-only change-history view: it does not
// look at what a view's SQL reads, and `reimbursement_record` touches
// reimbursement_agreements, which is endpoint_only with read:"adult". A child
// clicking it would get an opaque 500 in a new tab, and there is no way to
// catch that once window.open has handed the URL to the browser.
//
// So the whole block is adult-gated instead of one view being special-cased —
// which would put the very copy of the manifest back that using the endpoint
// avoids. Every report here is a money record, the Add button is already
// adult-only for the same reason, and the endpoint refuses guests outright.

const REPORTS_URL = window.__REPORTS_URL ?? '';

async function loadReportViews() {
  if (!REPORTS_URL || !IS_ADULT) return;
  try {
    const res = await fetch(REPORTS_URL, { headers: { Accept: 'application/json' } });
    if (!res.ok) return;
    const body = await res.json();
    reportViews = Array.isArray(body?.views) ? body.views : [];
  } catch {
    reportViews = [];   // an export button that cannot work is worse than none
  }
}

function renderExportBlock() {
  const el = document.getElementById('export-block');
  if (!el) return;
  if (!reportViews.length || !IS_ADULT) { el.innerHTML = ''; return; }

  const { from, to } = reportBounds();
  const periodName = summaryPeriod === 'all'
    ? 'all time'
    : document.getElementById('summary-period')?.selectedOptions?.[0]?.textContent ?? 'this period';

  el.innerHTML = `
    <div class="section-label">Export</div>
    <div class="export-card">
      ${reportViews.map(v => `
        <div class="export-row" data-testid="export-row" data-view="${esc(v.id)}">
          <div class="export-row-main">
            <div class="export-row-title">${esc(v.title)}</div>
            ${v.description ? `<div class="export-row-sub">${esc(v.description)}</div>` : ''}
          </div>
          <div class="export-actions">
            <button class="btn btn-sm btn-ghost" data-action="runReport"
                    data-view="${esc(v.id)}" data-format="html">View</button>
            <button class="btn btn-sm btn-primary" data-action="runReport"
                    data-view="${esc(v.id)}" data-format="csv">CSV</button>
          </div>
        </div>`).join('')}
      <p class="hint" style="margin-top:10px">Covers ${esc(periodName)}${
        from ? ` (${esc(from)} to ${esc(to)})` : ''
      }. Each document is stamped with who generated it, when, and a checksum.</p>
    </div>`;
}

// rangeForPeriod's upper bound is the synthetic '-32' that makes a string
// comparison cover a whole month without knowing its length. The hub validates
// ?to= as a real date and a reader would rightly balk at "September 32", so
// both the request and the on-screen hint use the last calendar day. Every
// month has a 31st in string terms, and no stored date can fall between the
// two, so nothing is lost by clamping.
function reportBounds() {
  const { from, to } = rangeForPeriod(summaryPeriod);
  return { from, to: to ? to.replace(/-32$/, '-31') : to };
}

window._runReport = function(viewId, format) {
  if (!REPORTS_URL) return;
  const url = new URL(`${REPORTS_URL}/${encodeURIComponent(viewId)}`, window.location.href);
  url.searchParams.set('format', format);
  const { from, to } = reportBounds();
  if (from) url.searchParams.set('from', from);
  if (to)   url.searchParams.set('to', to);
  // A new tab, not this frame: the CSV comes back as an attachment (the iframe
  // is sandboxed with allow-downloads and allow-popups) and the HTML document
  // carries its own strict CSP, which would fight this page's if it rendered
  // inside it.
  window.open(url.toString(), '_blank', 'noopener');
};

/* ── Reimbursement requests ──────────────────────────── */
// The one-tap "settle up" on the Balances tab records a payment unilaterally,
// which is fine between housemates. A reimbursement request is the two-party
// version for shared spaces: it isn't binding until BOTH sides countersign
// through /api/agree, and the agreed amount is snapshotted at lock.
function renderRequests() {
  const el = document.getElementById('request-list');
  if (!el) return;
  document.getElementById('request-btn').hidden = !IS_ADULT;
  document.getElementById('rules-btn').hidden   = !IS_ADULT;

  if (!requests.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🤝</div>
      <p>No reimbursement requests.</p>
      <p class="empty-sub">Ask someone to pay you back for a shared cost — you both confirm the amount before it counts.</p>
    </div>`;
    return;
  }
  el.innerHTML = requests.map(requestCard).join('');
}

function requestCard(r) {
  const other = r.requester_id === ME.id ? r.payer_id : r.requester_id;
  const mine  = r.requester_id === ME.id;
  const iAgreed = mine ? r.requester_agreed : r.payer_agreed;
  const theyAgreed = mine ? r.payer_agreed : r.requester_agreed;

  const badge = {
    pending:   ['badge-pending',   'Awaiting confirmation'],
    locked:    ['badge-locked',    'Confirmed'],
    settled:   ['badge-settled',   'Settled'],
    cancelled: ['badge-cancelled', 'Cancelled'],
  }[r.status] ?? ['badge-pending', r.status];

  const actions = [];
  if (r.status === 'pending' && IS_ADULT) {
    if (!iAgreed) actions.push(`<button class="btn-sm btn-primary" data-testid="confirm-btn" data-request-id="${esc(r.id)}" data-action="agreeRequest" data-request="${esc(r.id)}">Confirm</button>`);
    // Either party may cancel, not just the requester. A pending request locks
    // only once BOTH sides confirm, and the hub's agree endpoint has no roster
    // awareness — so if the requester leaves the household, a payer who could
    // only ever confirm was left with a request stuck pending forever, counted
    // in their balance, with no way to clear it. The row policy already allows
    // it: party_scoped rewrites UPDATE to `requester_id OR payer_id = me`.
    actions.push(`<button class="btn-sm" data-action="cancelRequest" data-request="${esc(r.id)}">Cancel</button>`);
  }
  if (r.status === 'locked' && IS_ADULT) {
    actions.push(`<button class="btn-sm btn-primary" data-action="settleRequest" data-request="${esc(r.id)}">Record payment</button>`);
  }

  return `
    <div class="request-card" data-testid="request-card" data-request-id="${esc(r.id)}">
      <div class="request-head">
        <div>
          <div class="request-title">${mine ? 'You asked' : 'Asked of you by'} ${esc(memberName(other))}</div>
          <div class="request-sub">${esc(r.note || 'Shared cost')} · ${esc(fmtDate(r.created_at?.slice(0, 10)))}</div>
        </div>
        <div class="request-amount">${fmtMoney(r.amount_cents)}</div>
      </div>
      <div class="request-foot">
        <span class="badge ${badge[0]}">${esc(badge[1])}</span>
        ${r.status === 'pending'
          ? `<span class="request-hint" data-testid="request-hint" data-request-id="${esc(r.id)}">${iAgreed ? 'Waiting on them' : theyAgreed ? 'They confirmed — your turn' : 'Neither side has confirmed'}</span>`
          : ''}
        <span class="request-actions">${actions.join('')}</span>
      </div>
      ${r.status === 'locked' && r.payer_id === ME.id
        ? payBlock(r.requester_id, r.amount_cents, r.note || '')
        : ''}
    </div>`;
}

function memberName(id) { return memberMap.get(id)?.name ?? 'Someone'; }

async function agreeOnServer(id, agreed) {
  const res = await fetch(`/run/${APP_ID}/api/agree`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ table: 'reimbursement_agreements', id, agreed }),
  });
  if (!res.ok) {
    throw new Error((await res.json().catch(() => ({}))).error || 'Could not record your confirmation');
  }
}

  modalEl.innerHTML = `<div class="modal-sheet">${html}</div>`;
  modalEl.addEventListener('click', e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  requestAnimationFrame(() => modalEl?.querySelector('input, select, textarea')?.focus());
  document.addEventListener('keydown', onEsc);
}

function onEsc(e) { if (e.key === 'Escape') closeModal(); }

function closeModal() {
  if (!modalEl) return;
  document.removeEventListener('keydown', onEsc);
  modalEl.classList.add('closing');
  const el = modalEl;
  setTimeout(() => { el.remove(); }, 200);
  modalEl = null;
}

/** Weight input for the live member, in whichever unit the method is using.
 *  Percent arrives as a percentage and is stored in basis points, so 33.33%
 *  is an exact 3333 rather than a float that later has to be rounded twice. */
window._setWeight = function(memberId, value) {
  const n = parseFloat(value);
  // Clamped on the way in, not only validated on the way out. `min="0"` on the
  // input is a browser courtesy — it does not stop a paste, a spinner on a
  // detached field, or a stale value — and a negative share apportions a
  // NEGATIVE amount_cents, which computeBalances reads as the payer owing the
  // member money.
  f.weights[memberId] = f.splitType === 'percent'
    ? (isNaN(n) ? 0 : Math.min(TOTAL_BP, Math.max(0, Math.round(n * 100))))
    : (isNaN(n) ? 0 : Math.min(MAX_SHARES, Math.max(0, Math.trunc(n))));
  updateWeightTotals();
  validateForm();
};

window._formChange = function() { updateFormPreview(); };

  f.custom[memberId] = val;
  updateCustomRemaining();

};

function getAmountCents() {
  const val = parseFloat(document.getElementById('f-amount')?.value || '0');
  return isNaN(val) ? 0 : Math.round(val * 100);
}

/**
 * Fills in weights for the members that have none, in the unit the live method
 * uses. Percent is re-evened whenever the selected members change: a 60/40
 * agreed between two people says nothing about three, and carrying the old
 * numbers forward would leave a rule that quietly no longer totals 100%.
 */
function seedWeights() {
  const ids = [...f.splitAmong];
  if (f.splitType === 'shares') {
    for (const id of ids) if (!Number.isInteger(f.weights[id])) f.weights[id] = 1;
    return;
  }
  if (f.splitType !== 'percent') return;
  const covers = ids.length > 0
    && ids.every(id => Number.isInteger(f.weights[id]))
    && ids.reduce((s, id) => s + f.weights[id], 0) === TOTAL_BP;
  if (covers) return;
  f.weights = {};
  const n = ids.length;
  if (!n) return;
  // Exactly 100%: an even three-way share is 33.33/33.33/33.34, not 99.99%.
  const even = Math.floor(TOTAL_BP / n);
  ids.forEach((id, i) => { f.weights[id] = even + (i === 0 ? TOTAL_BP - even * n : 0); });
}

/** The live weights as apportionByShares / apportionByPercent want them. */
function weightRows(ids) {
  return ids.map(id => ({ member_id: id, weight: f.weights[id] ?? 0 }));
}

function updateFormPreview() {
  const amountCents  = getAmountCents();
  const splitMembers = [...f.splitAmong];
  const previewEl    = document.getElementById('f-split-preview');
  if (!previewEl) return;
  seedWeights();

  if (f.splitType === 'shares' || f.splitType === 'percent') {
    const isPercent = f.splitType === 'percent';
    previewEl.innerHTML = `
      <div class="custom-amounts">
        ${splitMembers.map(id => {
          const m = memberMap.get(id) ?? { id, name: id, role: 'adult' };
          const raw = f.weights[id] ?? 0;
          return `<div class="custom-row">
            <div class="custom-row-label">${avatar(m, 'sm')} ${esc(m.name)}</div>
            <input class="custom-input" type="number"
                   min="0" ${isPercent ? 'max="100" step="0.01"' : `max="${MAX_SHARES}" step="1"`}
                   value="${esc(String(isPercent ? (raw / 100).toFixed(2) : raw))}"
                   data-input="weightInput" data-member="${esc(id)}"
                   aria-label="${esc(m.name)} ${isPercent ? 'percent' : 'shares'}">
            <div class="split-preview-amount" data-weight-amount="${esc(id)}"></div>
          </div>`;
        }).join('')}
        <div id="f-weight-total" class="split-remaining" data-testid="weight-total"></div>
      </div>`;
    updateWeightTotals();
    validateForm();
    return;
  }

  if (f.splitType === 'equal') {
    if (amountCents > 0 && splitMembers.length > 0) {
      const { splits: splitResult, source } =
        computeSplitsWithCategory(amountCents, splitMembers, 'equal', {}, categorySplits, f.category);
      const splitMap    = Object.fromEntries(splitResult.map(s => [s.member_id, s.amount_cents]));
      // Say which rule produced these numbers — an unexplained 70/30 in a
      // column labelled "Equal" is the kind of thing people argue about.
      const ruleNote = source === 'category'
        ? `<div class="hint" style="margin-bottom:6px">Using the saved split for ${esc(categoryFor(f.category).label)}.</div>`
        : '';
      previewEl.innerHTML = ruleNote + `
        <div class="split-preview">
          ${splitMembers.map(id => {
            const m = memberMap.get(id) ?? { id, name: id, role: 'adult' };
            return `<div class="split-preview-row">
              <div class="split-preview-member">${avatar(m, 'sm')} ${esc(m.name)}</div>
              <div class="split-preview-amount">${fmtSplit(splitMap[id] ?? 0)}</div>
            </div>`;
          }).join('')}
        </div>`;
    } else {
      previewEl.innerHTML = '';
    }
  } else {
    // Custom mode: show inputs
    previewEl.innerHTML = `
      <div class="custom-amounts">
        ${splitMembers.map(id => {
          const m = memberMap.get(id) ?? { id, name: id, role: 'adult' };
          return `<div class="custom-row">
            <div class="custom-row-label">${avatar(m, 'sm')} ${esc(m.name)}</div>
            <input class="custom-input" type="number" min="0" step="0.01"
                   placeholder="0.00"
                   value="${esc(f.custom[id] ?? '')}"
                   data-input="customInput" data-member="${esc(id)}">
          </div>`;
        }).join('')}
        <div id="f-remaining" class="split-remaining"></div>
      </div>`;
    updateCustomRemaining();
  }
  validateForm();
}

/**
 * Recomputes the per-member amounts and the footer line WITHOUT re-rendering
 * the inputs — re-rendering on every keystroke would move the caret to the end
 * of the field, which makes editing the middle of "33.33" impossible.
 */
function updateWeightTotals() {
  const ids = [...f.splitAmong];
  const amountCents = getAmountCents();
  const isPercent = f.splitType === 'percent';
  const rows = weightRows(ids);
  const total = rows.reduce((s, r) => s + r.weight, 0);

  // A percent set that does not total exactly 100% has no defined answer, and
  // apportioning one anyway produces a number that looks authoritative: 1%/0%
  // of $100 previewed as $1.01 and $0.01, because the largest-remainder pass
  // hands out at most one penny per member and the other 99 dollars vanish.
  // Show nothing until the rule is whole; the footer already says why.
  const percentReady = isPercent && total === TOTAL_BP;
  const sharesReady = !isPercent && validateShares(f.weights, ids);
  const split = amountCents > 0 && (percentReady || sharesReady)
    ? (isPercent
        ? apportionByPercent(amountCents, rows.map(r => ({ member_id: r.member_id, percent_bp: r.weight })))
        : apportionByShares(amountCents, rows.map(r => ({ member_id: r.member_id, shares: r.weight }))))
    : [];
  const byMember = new Map(split.map(x => [x.member_id, x.amount_cents]));
  for (const el of document.querySelectorAll('[data-weight-amount]')) {
    const cents = byMember.get(el.dataset.weightAmount);
    el.textContent = cents === undefined ? '' : fmtSplit(cents);
  }

  const el = document.getElementById('f-weight-total');
  if (!el) return;
  if (isPercent) {
    const ok = total === TOTAL_BP;
    el.className = `split-remaining ${ok ? 'ok' : 'bad'}`;
    el.textContent = ok ? '\u2713 Adds up to 100%' : `Currently ${(total / 100).toFixed(2)}% \u2014 must be 100%`;
  } else {
    const problem = sharesError(f.weights, ids);
    el.className = `split-remaining ${problem ? 'bad' : 'ok'}`;
    el.textContent = problem ?? `${total} share${total === 1 ? '' : 's'} in total`;
  }
}

function updateCustomRemaining() {
  const amountCents  = getAmountCents();
  const splitMembers = [...f.splitAmong];
  const entered = splitMembers.reduce((s, id) => {
    const v = parseFloat(f.custom[id] || '0');
    return s + (isNaN(v) ? 0 : Math.round(v * 100));
  }, 0);
  const remaining = amountCents - entered;
  const el = document.getElementById('f-remaining');
  if (!el) return;
  if (remaining === 0) {
    el.className = 'split-remaining ok';
    el.textContent = '✓ Balanced';
  } else if (remaining > 0) {
    el.className = 'split-remaining bad';
    el.textContent = `Remaining: ${fmtSplit(remaining)}`;
  } else {
    el.className = 'split-remaining bad';
    el.textContent = `Over by ${fmtSplit(-remaining)}`;
  }
}

function validateForm() {
  const btn = document.getElementById('f-save-btn');
  if (!btn) return;
  const amountCents  = getAmountCents();
  const splitMembers = [...f.splitAmong];
  let valid = amountCents > 0 && splitMembers.length > 0;

  if (valid && f.splitType === 'custom') {
    const customCents = Object.fromEntries(
      splitMembers.map(id => [id, Math.round((parseFloat(f.custom[id] || '0') || 0) * 100)])
    );
    valid = validateCustomSplits(amountCents, customCents);
  }
  if (valid && f.splitType === 'shares')  valid = validateShares(f.weights, splitMembers);
  if (valid && f.splitType === 'percent') {
    valid = validateCategoryPercents(
      splitMembers.map(id => ({ member_id: id, percent_bp: f.weights[id] ?? 0 })));
  }
  btn.disabled = !valid;
}

window._submitExpense = async function() {
  const amountCents  = getAmountCents();
  const description  = document.getElementById('f-desc')?.value.trim() || 'Expense';
  const date         = document.getElementById('f-date')?.value || hubToday();
  const splitMembers = [...f.splitAmong];

  const customCents = f.splitType === 'custom'
    ? Object.fromEntries(splitMembers.map(id => [id, Math.round((parseFloat(f.custom[id] || '0') || 0) * 100)]))
    : {};

  // The SOURCE, not f.splitType: leaving the form on Equal over a category
  // that carries a saved 70/30 rule produces a 70/30 split, and storing
  // "equal" against it makes the detail row and the exported ledger both
  // say something the numbers underneath contradict. That is exactly the
  // "why is this $80" question this app exists to answer.
  const { splits: splitResult, source: splitSource } = computeSplitsWithCategory(
    amountCents, splitMembers, f.splitType, customCents, categorySplits, f.category, f.weights);

  const btn = document.getElementById('f-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  const expId = crypto.randomUUID();
  const now   = new Date().toISOString();

  const receiptFileId = f.receiptFileId ?? null;
  const newExp = {
    id: expId, paid_by: f.paidBy, amount_cents: amountCents,
    description, category: f.category, date, split_type: splitSource, created_at: now,
    receipt_file_id: receiptFileId,
  };
  const newSplits = splitResult.map(s => ({
    id: crypto.randomUUID(), expense_id: expId,
    member_id: s.member_id, amount_cents: s.amount_cents,
  }));

  // Optimistic update
  expenses = [newExp, ...expenses];
  splits   = [...splits, ...newSplits];
  recompute();
  closeModal();
  renderAll();

  // Persist in background
  try {
    await db(
      'INSERT INTO app_expense_splitter__expenses (id, paid_by, amount_cents, description, category, date, split_type, created_at, receipt_file_id) VALUES (?,?,?,?,?,?,?,?,?)',
      [expId, f.paidBy, amountCents, description, f.category, date, splitSource, now, receiptFileId]
    );
    if (newSplits.length > 0) {
      const placeholders = newSplits.map(() => '(?,?,?,?)').join(',');
      const params = newSplits.flatMap(s => [s.id, s.expense_id, s.member_id, s.amount_cents]);
      await db(
        `INSERT INTO app_expense_splitter__expense_splits (id, expense_id, member_id, amount_cents) VALUES ${placeholders}`,
        params
      );
    }
    logActivity('finance_transaction_added', `${ME.name} added "${description}"`, {
      deepLink: { appId: APP_ID, params: { expenseId: expId } },
    });
    publishEvent('expense.created', expId, { description, amount_cents: amountCents });
  } catch (e) {
    // Roll back optimistic update
    expenses = expenses.filter(ex => ex.id !== expId);
    splits   = splits.filter(s => s.expense_id !== expId);
    // The receipt uploaded fine but has no row pointing at it now — drop it
    // rather than leaving an orphan counting against the storage quota.
    if (receiptFileId) FILES.delete(receiptFileId).catch(() => {});
    recompute();
    renderAll();
    toast(`Failed to save expense: ${e.message}`, 'error');
  }
};

window._deleteExpense = async function(expId) {
  const confirmed = await hubConfirm('Delete this expense? This cannot be undone.');
  if (!confirmed) return;

  const removedExp    = expenses.find(e => e.id === expId);
  const removedSplits = splits.filter(s => s.expense_id === expId);

  // Optimistic remove
  expenses = expenses.filter(e => e.id !== expId);
  splits   = splits.filter(s => s.expense_id !== expId);
  recompute();
  closeModal();
  renderAll();

  try {
    // One statement: manifest.delete_cascades removes the expense's splits in
    // the same transaction. As two calls, splits died FIRST — so a failure in
    // between left an expense nobody owed a share of (computeBalances contributes
    // nothing for an expense with no splits) and destroyed the detail needed to
    // rebuild it, while the catch below rolled back only the in-memory copy.
    await db('DELETE FROM app_expense_splitter__expenses WHERE id = ?', [expId]);
    // Only after the row is gone — a failed delete must not strand the row
    // pointing at a file that no longer exists. The receipt hangs off the
    // expense itself, so it is the client's to reclaim; the cascade covers
    // child-owned files only.
    if (removedExp?.receipt_file_id) FILES.delete(removedExp.receipt_file_id).catch(() => {});
  } catch (e) {
    // Roll back
    if (removedExp)    expenses = [removedExp, ...expenses];
    if (removedSplits) splits   = [...splits, ...removedSplits];
    recompute();
    renderAll();
    toast(`Failed to delete: ${e.message}`, 'error');
  }
};

async function hubConfirm(msg) {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'modal-backdrop';
    el.innerHTML = `
      <div class="modal-sheet" style="max-height:auto">
        <div class="modal-body" style="text-align:center;padding:24px 20px">
          <div style="font-size:1rem;font-weight:600;margin-bottom:20px">${esc(msg)}</div>
          <div style="display:flex;gap:8px;justify-content:center">
            <button class="btn btn-ghost" id="conf-no">Cancel</button>
            <button class="btn btn-danger" id="conf-yes">Delete</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(el);
    el.querySelector('#conf-no').addEventListener('click',  () => { el.remove(); resolve(false); });
    el.querySelector('#conf-yes').addEventListener('click', () => { el.remove(); resolve(true); });
  });
}

window._submitSettlement = async function(fromId, toId) {

  const id  = crypto.randomUUID();

  const newSettlement = { id, from_id: fromId, to_id: toId, amount_cents: amountCents, note: '', settled_at: now, created_at: now };

  settlements = [newSettlement, ...settlements];

    await db(

      [id, fromId, toId, amountCents, '', now, now]

/* ── Per-category split rules ────────────────────────── */
// Default is an even split. A saved rule says "medical is always 60/40" so the
// number doesn't have to be re-argued every time. Rules apply only to the
// members they name — see splitPercentsForCategory, which deliberately falls
// back to an even split rather than reallocating a stale rule.

window._openSplitRules = function() {
  openModal(`
    <div class="modal-header">
      <h2 class="modal-title">Split rules</h2>
      <button class="modal-close" data-action="closeModal">×</button>
    </div>
    <div class="modal-body">
      <label class="field"><span>Category</span>
        <select id="sr-cat" data-change="renderSplitRule">
          ${CATEGORIES.map(c => `<option value="${esc(c.id)}">${c.icon} ${esc(c.label)}</option>`).join('')}
        </select>
      </label>
      <div id="sr-rows"></div>
      <div id="sr-total" class="hint"></div>
      <p class="hint" style="margin-top:10px">Leave a category at an even split to
        use the default. Percentages must add up to 100%.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-action="closeModal">Cancel</button>
      <button class="btn btn-primary" id="sr-save" data-action="saveSplitRule">Save rule</button>
    </div>
  `);
  window._renderSplitRule();
};

window._renderSplitRule = function() {
  const cat = document.getElementById('sr-cat')?.value;
  const adultsHere = members.filter(m => m.role === 'adult');
  const saved = new Map(
    categorySplits.filter(r => r.category === cat).map(r => [r.member_id, Number(r.percent_bp) || 0]));
  // The even-split default has to total exactly 100% or the Save button starts
  // disabled — 3 people at 33.33% is 99.99%. Give the remainder to the first.
  const n = adultsHere.length;
  const evenBp = n ? Math.floor(TOTAL_BP / n) : 0;
  const evenFirst = n ? evenBp + (TOTAL_BP - evenBp * n) : 0;

  document.getElementById('sr-rows').innerHTML = adultsHere.map((m, i) => `
    <label class="field"><span>${esc(m.name)}</span>
      <input type="number" min="0" max="100" step="0.01" data-member="${esc(m.id)}"
             value="${((saved.get(m.id) ?? (i === 0 ? evenFirst : evenBp)) / 100).toFixed(2)}"
             data-input="splitRuleTotal">
    </label>`).join('');
  window._splitRuleTotal();
};

/** Percent inputs → basis points, so the saved value is an exact integer. */
function readSplitRuleInputs() {
  return [...document.querySelectorAll('#sr-rows input[data-member]')].map(el => ({
    member_id: el.dataset.member,
    percent_bp: Math.round((parseFloat(el.value) || 0) * 100),
  }));
}

window._splitRuleTotal = function() {
  const rows  = readSplitRuleInputs();
  const total = rows.reduce((s, r) => s + r.percent_bp, 0);
  const ok    = validateCategoryPercents(rows);
  const el    = document.getElementById('sr-total');
  if (el) {
    el.textContent = ok ? '✓ Adds up to 100%' : `Currently ${(total / 100).toFixed(2)}% — must be 100%`;
    el.style.color = ok ? 'var(--green, #166534)' : 'var(--red, #b91c1c)';
  }
  const btn = document.getElementById('sr-save');
  if (btn) btn.disabled = !ok;
};

window._saveSplitRule = async function() {
  const cat  = document.getElementById('sr-cat')?.value;
  const rows = readSplitRuleInputs();
  if (!validateCategoryPercents(rows)) return;

  const btn = document.getElementById('sr-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  const now = new Date().toISOString();
  try {
    // Replace the whole rule for this category — a partial update could leave
    // orphan rows that no longer sum to 100% and silently disable the rule.
    //
    // One atomic batch, not two calls. As two, a DELETE that succeeded and an
    // INSERT that failed DELETED the rule the member was editing: the toast
    // said the save had failed, which is true and reads as "nothing changed",
    // and every later expense in that category quietly went back to an even
    // split. splitPercentsForCategory cannot tell a rule that was never set
    // from one that was just destroyed, so nothing downstream reports it
    // either. Same shape as _savePayHandle, for the same reason.
    const statements = [{
      sql: 'DELETE FROM app_expense_splitter__category_splits WHERE category = ?',
      params: [cat],
    }];
    if (rows.length) {
      const placeholders = rows.map(() => '(?,?,?,?,?)').join(',');
      statements.push({
        sql: `INSERT INTO app_expense_splitter__category_splits (id, category, member_id, percent_bp, updated_at) VALUES ${placeholders}`,
        params: rows.flatMap(r => [crypto.randomUUID(), cat, r.member_id, r.percent_bp, now]),
      });
    }
    await dbBatch(statements);
    await loadData();
    closeModal();
    toast(`Split rule saved for ${categoryFor(cat).label}`, 'success');
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Save rule';
    toast(`Could not save rule: ${e.message}`, 'error');
  }
};

// pay is the one who needs it. Writes are pinned to the owner by
// manifest.row_policies.payment_handles.column_write_acls, so this UI offering
// only your own row is a convenience, not the enforcement.
