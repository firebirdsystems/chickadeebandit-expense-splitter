window._submitSettlement = async function(fromId, toId) {
  const origin = modalEl;
  if (origin?.dataset.saving === '1') return;
  const val = parseFloat(document.getElementById('s-amount')?.value || '0');
  if (!val || val <= 0) return;
  const amountCents = Math.round(val * 100);

  const id  = crypto.randomUUID();
  const now = new Date().toISOString();

  const newSettlement = { id, from_id: fromId, to_id: toId, amount_cents: amountCents, note: '', settled_at: now, created_at: now };

  // As in _submitExpense: the form stays open, and nothing reads "recorded",
  // until the hub has the payment.
  const btn = origin?.querySelector('[data-action="submitSettlement"]');
  if (origin) origin.dataset.saving = '1';
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    await db(
      'INSERT INTO app_expense_splitter__settlements (id, from_id, to_id, amount_cents, note, settled_at, created_at) VALUES (?,?,?,?,?,?,?)',
      [id, fromId, toId, amountCents, '', now, now]
    );
  } catch (e) {
    console.error('submitSettlement failed', e);
    saveFailed(origin, btn, 'Record Payment', failureLine(e, { action: 'record the payment', thing: 'payment' }));
    return;
  }

  settlements = [newSettlement, ...settlements];
  recompute();
  closeModalIfCurrent(origin);
  renderAll();
  toast('Payment recorded', 'success');
  const fromName = memberMap.get(fromId)?.name ?? fromId;
  const toName   = memberMap.get(toId)?.name   ?? toId;
  logActivity('finance_transaction_added', `${fromName} paid ${toName} ${fmtMoney(amountCents)}`, {});
  publishEvent('expense.settled', id, { from_id: fromId, to_id: toId, amount_cents: amountCents });
};

/* ── Per-category split rules ────────────────────────── */
// Default is an even split. A saved rule says "medical is always 60/40" so the
// number doesn't have to be re-argued every time. Rules apply only to the
// members they name — see splitPercentsForCategory, which deliberately falls
// back to an even split rather than reallocating a stale rule.

window._openSplitRules = function() {
  openModal(`
    <div class="modal-header">
      <h2 class="modal-title">Split rules</h2>
      <button class="modal-close" data-action="closeModal">×</button>
    </div>
    <div class="modal-body">
      <label class="field"><span>Category</span>
        <select id="sr-cat" data-change="renderSplitRule">
          ${CATEGORIES.map(c => `<option value="${esc(c.id)}">${esc(c.label)}</option>`).join('')}
        </select>
      </label>
      <div id="sr-rows"></div>
      <div id="sr-total" class="hint"></div>
      <p class="hint" style="margin-top:10px">Leave a category at an even split to
        use the default. Percentages must add up to 100%.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-action="closeModal">Cancel</button>
      <button class="btn btn-primary" id="sr-save" data-action="saveSplitRule">Save rule</button>
    </div>
  `);
  window._renderSplitRule();
};

window._renderSplitRule = function() {
  const cat = document.getElementById('sr-cat')?.value;
  const adultsHere = members.filter(m => m.role === 'adult');
  const saved = new Map(
    categorySplits.filter(r => r.category === cat).map(r => [r.member_id, Number(r.percent_bp) || 0]));
  // The even-split default has to total exactly 100% or the Save button starts
  // disabled — 3 people at 33.33% is 99.99%. Give the remainder to the first.
  const n = adultsHere.length;
  const evenBp = n ? Math.floor(TOTAL_BP / n) : 0;
  const evenFirst = n ? evenBp + (TOTAL_BP - evenBp * n) : 0;

  document.getElementById('sr-rows').innerHTML = adultsHere.map((m, i) => `
    <label class="field"><span>${esc(m.name)}</span>
      <input type="number" min="0" max="100" step="0.01" data-member="${esc(m.id)}"
             value="${((saved.get(m.id) ?? (i === 0 ? evenFirst : evenBp)) / 100).toFixed(2)}"
             data-input="splitRuleTotal">
    </label>`).join('');
  window._splitRuleTotal();
};

/** Percent inputs → basis points, so the saved value is an exact integer. */
function readSplitRuleInputs() {
  return [...document.querySelectorAll('#sr-rows input[data-member]')].map(el => ({
    member_id: el.dataset.member,
    percent_bp: Math.round((parseFloat(el.value) || 0) * 100),
  }));
}

window._splitRuleTotal = function() {
  const rows  = readSplitRuleInputs();
  const total = rows.reduce((s, r) => s + r.percent_bp, 0);
  const ok    = validateCategoryPercents(rows);
  const el    = document.getElementById('sr-total');
  if (el) {
    el.textContent = ok ? '✓ Adds up to 100%' : `Currently ${(total / 100).toFixed(2)}% — must be 100%`;
    el.style.color = ok ? 'var(--green, #166534)' : 'var(--red, #b91c1c)';
  }
  const btn = document.getElementById('sr-save');
  if (btn) btn.disabled = !ok;
};

window._saveSplitRule = async function() {
  const cat  = document.getElementById('sr-cat')?.value;
  const rows = readSplitRuleInputs();
  if (!validateCategoryPercents(rows)) return;

  const btn = document.getElementById('sr-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  const now = new Date().toISOString();
  try {
    // Replace the whole rule for this category — a partial update could leave
    // orphan rows that no longer sum to 100% and silently disable the rule.
    //
    // One atomic batch, not two calls. As two, a DELETE that succeeded and an
    // INSERT that failed DELETED the rule the member was editing: the toast
    // said the save had failed, which is true and reads as "nothing changed",
    // and every later expense in that category quietly went back to an even
    // split. splitPercentsForCategory cannot tell a rule that was never set
    // from one that was just destroyed, so nothing downstream reports it
    // either. Same shape as _savePayHandle, for the same reason.
    const statements = [{
      sql: 'DELETE FROM app_expense_splitter__category_splits WHERE category = ?',
      params: [cat],
    }];
    if (rows.length) {
      const placeholders = rows.map(() => '(?,?,?,?,?)').join(',');
      statements.push({
        sql: `INSERT INTO app_expense_splitter__category_splits (id, category, member_id, percent_bp, updated_at) VALUES ${placeholders}`,
        params: rows.flatMap(r => [crypto.randomUUID(), cat, r.member_id, r.percent_bp, now]),
      });
    }
    await dbBatch(statements);
    await reread();
    closeModal();
    toast(`Split rule saved for ${categoryFor(cat).label}`, 'success');
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Save rule';
    console.error('saveSplitRule failed', e);
    toast(failureLine(e, { action: 'save the rule', thing: 'split rule' }), 'error');
  }
};

/* ── Where to send the money ─────────────────────────── */
// A handle is stored once and read by everybody, because the person who has to
// pay is the one who needs it. Every write is pinned to the owner by
// manifest.row_policies.payment_handles (owner_or_visibility with
// write_owner_only) — INSERT, UPDATE and DELETE alike — so this UI offering
// only your own row is a convenience, not the enforcement.

window._openPayHandle = function() {
  const mine = handles.get(ME.id);
  openModal(`
    <div class="modal-header">
      <h2 class="modal-title">How to pay me</h2>
      <button class="modal-close" data-action="closeModal">×</button>
    </div>
    <div class="modal-body">
      <label class="field"><span>Service</span>
        <select id="ph-service" data-change="handleService">
          ${PAYMENT_SERVICES.map(sv =>
            `<option value="${esc(sv.id)}"${mine?.service === sv.id ? ' selected' : ''}>${esc(sv.label)}</option>`
          ).join('')}
        </select>
      </label>
      <label class="field"><span>Username</span>
        <input type="text" id="ph-handle" maxlength="64" autocomplete="off"
               value="${esc(mine?.handle ?? '')}" data-autofocus>
      </label>
      <p class="hint" id="ph-hint"></p>
      <p class="hint" style="margin-top:10px">Everyone here can see this so they
        know where to send what they owe you. Only you can change it.</p>
    </div>
    <div class="modal-footer">
      ${mine ? `<button class="btn btn-ghost" data-action="clearPayHandle">Remove</button>` : ''}
      <button class="btn btn-ghost" data-action="closeModal">Cancel</button>
      <button class="btn btn-primary" id="ph-save" data-action="savePayHandle">Save</button>
    </div>
  `);
  window._onHandleService();
  requestAnimationFrame(() => modalEl?.querySelector('[data-autofocus]')?.focus());
};

window._onHandleService = function() {
  const sv = paymentServiceFor(document.getElementById('ph-service')?.value);
  const hint = document.getElementById('ph-hint');
  if (hint) hint.textContent = sv.hint;
};

window._savePayHandle = async function() {
  const service = document.getElementById('ph-service')?.value;
  const raw     = document.getElementById('ph-handle')?.value ?? '';
  const check   = validateHandle(service, raw);
  if (!check.ok) { toast(check.error, 'error'); return; }

  const btn = document.getElementById('ph-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const now = new Date().toISOString();
  try {
    // Replace rather than upsert: the unique index on member_id means a plain
    // INSERT after the delete can only ever leave one row standing, and the
    // policy rewrites both statements with the same owner guard, so neither
    // half can reach anybody else's row even if this id were tampered with.
    //
    // One atomic batch, not two calls. As two, a DELETE that succeeded and an
    // INSERT that failed left the member with NO handle while the toast told
    // them the save had failed — so the next person to settle up saw nothing
    // and the member had no reason to look.
    //
    // `visibility` is written explicitly rather than left to the column
    // default: it is what owner_or_visibility reads the row through, and a
    // handle nobody but its owner can see is a handle nobody can pay.
    await dbBatch([
      { sql: 'DELETE FROM app_expense_splitter__payment_handles WHERE member_id = ?', params: [ME.id] },
      { sql: 'INSERT INTO app_expense_splitter__payment_handles (id, member_id, service, handle, visibility, updated_at) VALUES (?,?,?,?,?,?)',
        params: [crypto.randomUUID(), ME.id, service, check.handle, 'everyone', now] },
    ]);
    await reread();
    closeModal();
    renderAll();
    toast('Saved', 'success');
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
    console.error('savePayHandle failed', e);
    toast(failureLine(e, { action: 'save how to pay you', thing: 'payment username' }), 'error');
  }
};

window._clearPayHandle = async function() {
  try {
    await db('DELETE FROM app_expense_splitter__payment_handles WHERE member_id = ?', [ME.id]);
    await reread();
    closeModal();
    renderAll();
    toast('Removed', 'success');
  } catch (e) {
    console.error('clearPayHandle failed', e);
    toast(failureLine(e, { action: 'remove how to pay you', thing: 'payment username' }), 'error');
  }
};

/**
 * The "pay them now" block for one recipient, or '' when there is nothing
 * useful to show. Zelle and "other" have no web hand-off, so those print the
 * handle to copy instead of a link that would go nowhere.
 */
function payBlock(recipientId, amountCents, note = '') {
  const saved = handles.get(recipientId);
  if (!saved) return '';
  const name = memberName(recipientId);
  const url  = payLink(saved.service, saved.handle, amountCents, note);
  const shown = displayHandle(saved.service, saved.handle);
  const label = paymentServiceFor(saved.service).label;
  if (!url) {
    return `<p class="pay-note">${esc(name)} takes ${esc(label)} at <strong>${esc(shown)}</strong>.</p>`;
  }
  return `
    <p class="pay-note" style="margin-bottom:8px">${esc(name)} takes ${esc(label)} at <strong>${esc(shown)}</strong>.</p>
    <a class="pay-link" data-pay-link data-testid="pay-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">
      Pay with ${esc(label)} ↗
    </a>`;
}

/* ── Reimbursement request actions ───────────────────── */

window._openRequest = function() {
  const others = members.filter(m => m.id !== ME.id && m.role === 'adult');
  if (!others.length) {
    toast('There is nobody else here to request money from', 'error');
    return;
  }
  openModal(`
    <div class="modal-header">
      <h2 class="modal-title">Request money back</h2>
      <button class="modal-close" data-action="closeModal">×</button>
    </div>
    <div class="modal-body">
      <label class="field"><span>Who owes you</span>
        <select id="r-payer">
          ${others.map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')}
        </select>
      </label>
      <label class="field"><span>Amount</span>
        <div class="amount-wrap">
          <span class="amount-symbol">$</span>
          <input type="number" id="r-amount" class="amount-input" min="0.01" step="0.01" data-autofocus>
        </div>
      </label>
      <label class="field"><span>What for</span>
        <input type="text" id="r-note" maxlength="200" placeholder="e.g. Half of the dentist bill">
      </label>
      <p class="hint">They'll be asked to confirm. Nothing is recorded against the
        balance until you both agree on the amount.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-action="closeModal">Cancel</button>
      <button class="btn btn-primary" id="r-submit" data-action="submitRequest">Send request</button>
    </div>
  `);
  // The autofocus attribute is blocked in the cross-origin app iframe.
  requestAnimationFrame(() => modalEl?.querySelector('[data-autofocus]')?.focus());
};

window._submitRequest = async function() {
  const btn = document.getElementById('r-submit');
  const payerId = document.getElementById('r-payer')?.value;
  const note    = (document.getElementById('r-note')?.value ?? '').trim();
  const dollars = parseFloat(document.getElementById('r-amount')?.value || '0');
  const amountCents = Math.round(dollars * 100);

  const check = validateReimbursement({ requester_id: ME.id, payer_id: payerId, amount_cents: amountCents });
  if (!check.ok) { toast(check.error, 'error'); return; }

  btn.disabled = true; btn.textContent = 'Sending…';
  const id  = crypto.randomUUID();
  const now = new Date().toISOString();

  try {
    await db(
      'INSERT INTO app_expense_splitter__reimbursements (id, requester_id, payer_id, amount_cents, note, status, created_at, updated_at) VALUES (?,?,?,?,?,?,?,?)',
      [id, ME.id, payerId, amountCents, note, 'pending', now, now]
    );
    // Bootstraps the agreement row (init_from_table) and records my own consent
    // to exactly what was just written. The request row is stored by now, so a
    // failure here is not a failed send: saying so left the form open, and a
    // second press inserted a second request. The card offers Confirm instead.
    let confirmed = true;
    try {
      await agreeOnServer(id, true, { amount_cents: amountCents, note });
    } catch (e) {
      confirmed = false;
      console.error('submitRequest: confirmation failed', e);
    }
    await reread();
    recompute();
    closeModal();
    renderAll();
    if (confirmed) toast('Request sent', 'success');
    else toast('Request sent, but your confirmation wasn’t recorded — press Confirm on it.', 'error');
    publishEvent('expense.reimbursement_requested', id, { payer_id: payerId, amount_cents: amountCents });
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Send request';
    console.error('submitRequest failed', e);
    toast(failureLine(e, { action: 'send the request', thing: 'request' }), 'error');
  }
};

const REQUEST_CHANGED = 'This request changed, so nothing was confirmed. Check it again.';

window._agreeRequest = async function(id) {
  const shown = requests.find(x => x.id === id);
  if (!shown || shown.status !== 'pending' || shown.terms_changed) return;
  const terms = termsOf(shown);
  try {
    // Read it again first: a confirmation is for the amount and note on the
    // card that was pressed, so a request that reads differently by now is
    // shown as it is instead. The hub makes the same comparison (409 below)
    // for a change that lands after this read.
    await loadData();
    recompute();
    const now = requests.find(x => x.id === id);
    const same = now && now.status === 'pending' && !now.terms_changed
      && now.amount_cents === terms.amount_cents && (now.note ?? null) === terms.note;
    if (!same) {
      renderAll();
      toast(REQUEST_CHANGED, 'error');
      return;
    }
    await agreeOnServer(id, true, terms);
    await reread();
    recompute();
    renderAll();
    toast('Confirmed', 'success');
  } catch (e) {
    // 409 here is the agree endpoint saying the terms changed, not a missed
    // requireChanges guard, so it keeps its own check.
    if (e.status === 409) {
      await rereadAndRender();
      toast(REQUEST_CHANGED, 'error');
      return;
    }
    console.error('agreeRequest failed', e);
    toast(failureLine(e, { action: 'confirm the request', thing: 'request' }), 'error');
  }
};

window._cancelRequest = async function(id) {
  if (!await hubConfirm('Cancel this request?', 'Cancel request', { noLabel: 'Keep it' })) return;
  try {
    const { changed } = await db(
      'UPDATE app_expense_splitter__reimbursements SET status = ?, updated_at = ? WHERE id = ?',
      ['cancelled', new Date().toISOString(), id]
    );
    // The re-read follows a committed write; its failure is not the write's.
    let reread = false;
    try { await loadData(); reread = !requestsFailed; } catch (e2) { console.error('re-read after a write failed', e2); }
    recompute();
    renderAll();
    // A request already settled or cancelled is frozen: the hub answers 200
    // and changes nothing. The re-read says whether it is gone or was closed.
    if (changed === 0) {
      const found = reread ? requests.some(x => x.id === id) : undefined;
      // Without a re-read nothing is known: the plain line, not a claim.
      toast(found === undefined ? failureLine(null, { action: 'cancel the request', thing: 'request' })
        : found === false ? 'This request has been removed.' : 'This request was already settled or cancelled.', 'error');
      return;
    }
    toast('Request cancelled', 'success');
  } catch (e) {
    console.error('cancelRequest failed', e);
    toast(failureLine(e, { action: 'cancel the request', thing: 'request' }), 'error');
  }
};

// A confirmed request becomes a real settlement — the same row the balance math
// already understands — and the request is closed so it can't be settled twice.
// The settlement id and time are pinned per request until the outcome is
// known: a retry after a lost answer sends the same ones, so a re-read that
// finds this id knows the earlier attempt landed. One attempt per request at a
// time, so two in flight cannot both find the pin and both report success.
const settlePins = new Map();
const settling = new Set();
window._settleRequest = async function(id) {
  const r = requests.find(x => x.id === id);
  if (!r || r.status !== 'locked') return;
  if (!await hubConfirm(`Record ${fmtMoney(r.amount_cents)} as paid?`, 'Record payment', { okClass: 'btn-primary' })) return;
  if (settling.has(id)) return;
  settling.add(id);
  try { await settleRequest(id, r); } finally { settling.delete(id); }
};

async function settleRequest(id, r) {
  if (!settlePins.has(id)) settlePins.set(id, { sid: crypto.randomUUID(), now: new Date().toISOString() });
  const { sid, now } = settlePins.get(id);
  let rereadDone = false;
  try {
    // One transaction: the request closes only while it is still open, and
    // the settlement lands only if it did. Both parties pressing the button
    // cannot record the payment twice, and neither half can stand alone.
    //
    // 'pending' is the request row's own status for the whole time it is open.
    // "Confirmed" (`r.status === 'locked'`, checked above) is read from the
    // agreement row — the hub locks THAT row and never touches this one — so a
    // guard on 'locked' here matched nothing and no payment was ever recorded.
    await dbBatch([
      { sql: 'UPDATE app_expense_splitter__reimbursements SET status = ?, updated_at = ? WHERE id = ? AND status = ?',
        params: ['settled', now, id, 'pending'], requireChanges: true },
      { sql: 'INSERT INTO app_expense_splitter__settlements (id, from_id, to_id, amount_cents, note, settled_at, created_at) VALUES (?,?,?,?,?,?,?)',
        params: [sid, r.payer_id, r.requester_id, r.amount_cents, r.note ?? '', now, now] },
    ]);
  } catch (e) {
    // An unmet requireChanges rolls the batch back: someone closed the request
    // first — or an earlier attempt of this one did, its answer lost.
    const conflict = isStaleConflict(e);
    if (!conflict && !outcomeUnknown(e)) {
      settlePins.delete(id);
      console.error('settleRequest failed', e);
      toast(failureLine(e, { action: 'record the payment', thing: 'request' }), 'error');
      return;
    }
    const reread = await rereadAndRender();
    const outcome = pinnedWriteOutcome({
      conflict, reread,
      landed: settlements.some(s => s.id === sid),
      found: requestsFailed ? undefined : requests.some(x => x.id === id),
    });
    if (outcome !== 'landed') {
      if (outcome === 'removed' || outcome === 'changed') settlePins.delete(id);
      if (!conflict) console.error('settleRequest failed', e);
      // The settlement id is ours: with the re-read failed, a UNIQUE answer may be
      // this request's own first try, so nothing is known — "try again".
      toast(outcome === 'failed' ? failureLine(reread ? e : null, { action: 'record the payment', thing: 'request' })
        : outcome === 'removed' ? 'This request has been removed.'
        : outcome === 'changed' ? 'This request was already settled or cancelled.'
        : failureLine(null, { action: 'record the payment', thing: 'request' }), 'error');
      return;
    }
    rereadDone = true;
  }
  // Recorded — by this attempt, or by an earlier one whose answer was lost.
  settlePins.delete(id);
  try {
    if (!rereadDone) await reread();
    recompute();
    renderAll();
  } catch (e) { console.error('render after a write failed', e); }
  toast('Payment recorded', 'success');
  publishEvent('expense.settled', sid, {
    from_id: r.payer_id, to_id: r.requester_id, amount_cents: r.amount_cents,
  });
}

/* ── Toast ───────────────────────────────────────────── */
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  requestAnimationFrame(() => { requestAnimationFrame(() => el.classList.add('show')); });
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

/* ── Widget mode ─────────────────────────────────────── */
function renderWidget() {
  document.getElementById('skeleton-state').hidden = true;
  document.getElementById('widget-root').hidden    = false;

  const myBal = balances[ME.id] ?? 0;
  const pending = transactions.filter(t => t.from_id === ME.id || t.to_id === ME.id).length;
  const el = document.getElementById('widget-root');
  el.onclick = () => window.parent?.postMessage({ type: 'hub:open', appId: APP_ID }, '*');

  if (myBal === 0) {
    el.innerHTML = `<div class="widget-settled">${glyph('tick')} All settled up</div>`;
  } else if (myBal > 0) {
    el.innerHTML = `
      <div class="widget-label">You're owed</div>
      <div class="widget-balance" style="color:var(--green-ink)">${fmtMoney(myBal)}</div>
      ${pending ? `<div class="widget-sub">${pending} pending</div>` : ''}`;
  } else {
    el.innerHTML = `
      <div class="widget-label">You owe</div>
      <div class="widget-balance" style="color:var(--red-ink)">${fmtMoney(-myBal)}</div>
      ${pending ? `<div class="widget-sub">${pending} pending</div>` : ''}`;
  }
}

/* ── Activity logging ────────────────────────────────────────────────────
   `type` must be one of the hub's own ActivityType values that a caller is
   allowed to write (CALLER_ALLOWED_ACTIVITY_TYPES) — it is NOT this app's
   event name. Both call sites used to pass the event type, which the hub
   refused with a 403 on every expense; a fetch does not reject on 4xx, so
   the .catch() below hid it and no household ever saw an entry.

   __ACTIVITY_URL, not a bare '/api/activity': the app-runtime route stamps
   the row with this app's id, so the feed can attribute and filter it. The
   member-facing route leaves app_id null. */
function logActivity(type, description, metadata) {
  fetch(window.__ACTIVITY_URL ?? '/api/activity', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type, description, metadata }),
  }).catch(() => {});
}

/* ── Cross-app event bus (declared in manifest `publishes`) ───────────────
   Non-value-bearing notices — no money/points are minted from them — so no
   publish_acls gating is required. No push (alert_on intentionally omitted). */
function publishEvent(type, subjectId, payload = {}) {
  if (!DB) return Promise.resolve();
  // Fire-and-forget for every caller but one: announcePosted awaits it to pace
  // a backlog's events. It never rejects.
  return fetch(EVENTS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source_app_id: APP_ID, type, subject_id: subjectId, payload }),
  }).catch(() => {});
}
